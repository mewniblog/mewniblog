<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEWNIBLOG — My Blog As An WNI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Fredoka:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #f6eee6;
      --grid-line: rgba(255, 255, 255, 0.78);
      --border-dark: #5b5353;
      --text-slate: #3d4a57;
      --text-body: #554e4e;
      --text-muted: #766d6d;
      --pink-bar: #f2b5be;
      --pink-progress: #df8b9e;
      --pink-arrow: #f1b3bd;
      --mint-bar: #9fd0c4;
      --campus-color: #9fc6d6;
      --campus-dark: #5c8a9d;
      --gov-color: #9c4e77;
      --gov-dark: #743356;
      --diary-color: #f9aa5b;
      --diary-dark: #c97729;
      --comment-bar: #e57a55;
      --scroll-track: #cbe7f7;
      --scroll-thumb: #f3b7c0;
      --like-blue: #7e77d1;
      --dislike-red: #b64c45;
      --font-pixel: 'Silkscreen', 'Courier New', monospace;
      --font-retro: 'Chakra Petch', 'Courier New', monospace;
      --font-chunky: 'Fredoka', 'Trebuchet MS', sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      min-height: 100%;
      background-color: var(--bg-cream);
      background-image:
        linear-gradient(to right, var(--grid-line) 1.5px, transparent 1.5px),
        linear-gradient(to bottom, var(--grid-line) 1.5px, transparent 1.5px);
      background-size: 46px 46px;
      color: var(--text-body);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {
      outline: 2px dashed var(--gov-color);
      outline-offset: 2px;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    /* Floating Top Bar (Admin Badge & Sound Control on non-home pages) */
    .floating-controls {
      position: fixed;
      top: 12px;
      right: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 800;
    }

    .float-pill-btn {
      font-family: var(--font-retro);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 6px 12px;
      background: #fffaf5;
      border: 2px solid var(--border-dark);
      box-shadow: 3px 3px 0 rgba(91, 83, 83, 0.2);
      color: var(--text-slate);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.12s, background 0.12s;
    }

    .float-pill-btn:hover {
      transform: translateY(-1px);
      background: var(--pink-bar);
    }

    .float-pill-btn.admin-pill {
      background: var(--mint-bar);
    }

    .notif-dot {
      background: var(--comment-bar);
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      padding: 1px 5px;
      border-radius: 999px;
      border: 1.5px solid var(--border-dark);
    }

    /* App Shell */
    .app-shell {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px 36px;
    }

    .view-container {
      width: 100%;
      max-width: 1120px;
      animation: fadeSlideIn 0.25s ease-out;
    }

    @keyframes fadeSlideIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Retro Window Chrome */
    .retro-window {
      background: var(--bg-cream);
      border: 2.5px solid var(--border-dark);
      box-shadow: 6px 6px 0 rgba(91, 83, 83, 0.14);
      position: relative;
      overflow: hidden;
    }

    .retro-titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      border-bottom: 2.5px solid var(--border-dark);
      gap: 12px;
      min-height: 54px;
    }

    .retro-titlebar.center-title {
      justify-content: center;
      position: relative;
    }

    .home-speaker-btn {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--gov-color);
      transition: transform 0.15s ease, background 0.15s ease;
    }

    .home-speaker-btn:hover {
      background: rgba(255, 255, 255, 0.45);
      transform: translateY(-50%) scale(1.08);
    }

    .window-controls {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .win-btn {
      width: 26px;
      height: 26px;
      border: 2px solid var(--border-dark);
      background: rgba(255, 255, 255, 0.28);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-pixel);
      font-size: 13px;
      color: var(--text-slate);
      transition: transform 0.12s, background 0.15s;
      line-height: 1;
    }

    .win-btn:hover {
      background: rgba(255, 255, 255, 0.7);
      transform: translateY(-1px);
    }

    .win-btn:active {
      transform: translateY(1px);
    }

    /* Admin Icon Controls on Article Titlebar (Pages 3-5) */
    .article-admin-icons {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .article-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-slate);
      background: rgba(255, 255, 255, 0.3);
      border: 1.5px solid rgba(91, 83, 83, 0.55);
      transition: transform 0.14s, background 0.14s;
    }

    .article-icon-btn:hover {
      background: rgba(255, 255, 255, 0.8);
      transform: translateY(-1px);
    }

    .article-theme-government .article-icon-btn {
      color: #fff8f2;
      border-color: rgba(255, 248, 242, 0.65);
      background: rgba(255, 255, 255, 0.12);
    }

    .article-theme-government .article-icon-btn:hover {
      background: rgba(255, 255, 255, 0.28);
    }

    /* Retro Segmented Progress Bar */
    .progress-bar-box {
      width: 100%;
      height: 28px;
      border: 2px solid var(--border-dark);
      background: var(--bg-cream);
      padding: 3px;
      display: grid;
      grid-template-columns: repeat(16, 1fr);
      gap: 3px;
    }

    .progress-seg {
      height: 100%;
      background: transparent;
      transition: background 0.2s ease;
    }

    .progress-seg.filled {
      background: var(--pink-progress);
    }

    /* ================= VIEW 1: HOME ================= */
    .home-title {
      font-family: var(--font-pixel);
      font-size: clamp(2.1rem, 5.2vw, 3.7rem);
      font-weight: 700;
      color: #25303b;
      letter-spacing: 0.1em;
      line-height: 1.05;
      text-align: center;
      padding: 4px 48px;
      text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.7);
    }

    .home-body {
      padding: 20px 28px 26px;
      position: relative;
    }

    .home-subtitle-wrap {
      text-align: center;
      margin-bottom: 24px;
    }

    /* Secret Admin Doorway disguised as normal subtitle */
    .home-subtitle-btn {
      font-family: var(--font-chunky);
      font-size: clamp(0.95rem, 2vw, 1.35rem);
      letter-spacing: 0.28em;
      color: #6b6b6b;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 6px;
      transition: color 0.18s ease;
      cursor: default;
    }

    .home-subtitle-btn:hover {
      color: #5b5353;
    }

    .home-grid {
      display: grid;
      grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.15fr);
      gap: 24px;
      align-items: end;
    }

    .home-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 26px;
      height: 100%;
      padding-top: 12px;
    }

    .home-hero-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      width: 100%;
    }

    .chibi-left {
      width: 190px;
      flex-shrink: 0;
      transition: transform 0.25s ease;
      filter: drop-shadow(0 4px 6px rgba(91, 83, 83, 0.14));
    }

    .chibi-left:hover {
      transform: translateY(-5px) rotate(-2deg);
    }

    .play-cta-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .play-circle-btn {
      width: 154px;
      height: 154px;
      border-radius: 50%;
      background: #a4567b;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 5px 0 rgba(91, 83, 83, 0.25);
    }

    .play-circle-btn:hover {
      transform: scale(1.06) translateY(-2px);
      box-shadow: 0 8px 0 rgba(91, 83, 83, 0.22);
    }

    .play-circle-btn:active {
      transform: scale(0.98) translateY(2px);
      box-shadow: 0 2px 0 rgba(91, 83, 83, 0.25);
    }

    .play-circle-inner {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: #f0b3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .play-gloss {
      position: absolute;
      top: 12px;
      right: 17px;
      width: 18px;
      height: 7px;
      border-radius: 99px;
      background: #fff;
      transform: rotate(36deg);
      opacity: 0.9;
    }

    .play-gloss-dot {
      position: absolute;
      top: 28px;
      right: 12px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.9;
    }

    .play-label {
      font-family: var(--font-chunky);
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      color: #5b5353;
      text-transform: uppercase;
      text-align: center;
    }

    .home-progress-wrap {
      width: 100%;
      max-width: 440px;
    }

    .home-progress-caption {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 6px;
      font-family: var(--font-retro);
      font-size: 0.74rem;
      color: var(--text-muted);
    }

    /* Right column: Latest posts cards + Bio shortcut */
    .home-right {
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .latest-card {
      width: 100%;
      background: #ffffff;
      border: 2.5px solid #4d352e;
      border-radius: 16px;
      padding: 16px 22px;
      text-align: left;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .latest-card.theme-campus {
      box-shadow: 6px 6px 0 var(--campus-color), 6px 6px 0 2px #4d352e;
    }
    .latest-card.theme-government {
      box-shadow: 6px 6px 0 var(--gov-color), 6px 6px 0 2px #4d352e;
    }
    .latest-card.theme-diary {
      box-shadow: 6px 6px 0 var(--diary-color), 6px 6px 0 2px #4d352e;
    }

    .latest-card:hover {
      transform: translate(-2px, -2px);
    }

    .latest-card.theme-campus:hover {
      box-shadow: 8px 8px 0 var(--campus-color), 8px 8px 0 2px #4d352e;
    }
    .latest-card.theme-government:hover {
      box-shadow: 8px 8px 0 var(--gov-color), 8px 8px 0 2px #4d352e;
    }
    .latest-card.theme-diary:hover {
      box-shadow: 8px 8px 0 var(--diary-color), 8px 8px 0 2px #4d352e;
    }

    .latest-card:active {
      transform: translate(3px, 3px);
      box-shadow: 2px 2px 0 var(--border-dark);
    }

    .latest-tag {
      font-family: var(--font-retro);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .theme-campus .latest-tag { color: var(--campus-dark); }
    .theme-government .latest-tag { color: var(--gov-color); }
    .theme-diary .latest-tag { color: var(--diary-dark); }

    .latest-title {
      font-family: var(--font-pixel);
      font-size: clamp(0.88rem, 1.5vw, 1.08rem);
      color: #5b5353;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .home-bio-row {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-top: 2px;
      gap: 12px;
    }

    .home-footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .retro-chip-btn {
      font-family: var(--font-retro);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      background: #fff;
      border: 2px solid var(--border-dark);
      box-shadow: 3px 3px 0 var(--pink-bar);
      color: var(--text-slate);
      text-transform: uppercase;
      transition: transform 0.14s, box-shadow 0.14s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .retro-chip-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--pink-progress);
    }

    .retro-chip-btn.mint {
      background: var(--mint-bar);
      box-shadow: 3px 3px 0 var(--border-dark);
    }

    .retro-chip-btn.danger {
      background: #fae2e0;
      color: var(--dislike-red);
      box-shadow: 3px 3px 0 var(--dislike-red);
    }

    .bio-shortcut-btn {
      display: inline-flex;
      align-items: flex-end;
      gap: 8px;
      margin-left: auto;
      padding: 4px;
      transition: transform 0.2s ease;
    }

    .bio-shortcut-btn:hover {
      transform: translateY(-4px);
    }

    .bio-arrow-stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    .bio-arrow-svg {
      width: 44px;
      height: 44px;
      transition: transform 0.2s ease;
    }

    .bio-shortcut-btn:hover .bio-arrow-svg {
      transform: translate(3px, -3px) scale(1.08);
    }

    .bio-shortcut-label {
      font-family: var(--font-retro);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.25;
      text-transform: uppercase;
    }

    .chibi-right {
      width: 152px;
      flex-shrink: 0;
      filter: drop-shadow(0 4px 6px rgba(91, 83, 83, 0.15));
    }

    /* ================= VIEW 2: POSTS ARCHIVE ================= */
    .posts-header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .posts-banner {
      background: var(--mint-bar);
      border: 2.5px solid var(--border-dark);
      padding: 10px 32px;
      font-family: var(--font-chunky);
      font-size: clamp(1.1rem, 2.5vw, 1.7rem);
      color: var(--text-slate);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      box-shadow: 4px 4px 0 rgba(91, 83, 83, 0.15);
      text-align: center;
      flex: 1;
      min-width: 240px;
    }

    .posts-columns {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }

    .theme-column {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .theme-pill-header {
      border-radius: 999px;
      padding: 10px 18px;
      font-family: var(--font-chunky);
      font-size: 0.95rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      text-align: center;
      color: var(--text-slate);
      border: 2px solid var(--border-dark);
      box-shadow: 3px 3px 0 rgba(91, 83, 83, 0.16);
    }

    .theme-pill-header.campus { background: var(--campus-color); }
    .theme-pill-header.government { background: var(--gov-color); color: #fff8f2; }
    .theme-pill-header.diary { background: var(--diary-color); }

    .post-list-card {
      width: 100%;
      background: #ffffff;
      border: 2px solid #4d352e;
      border-radius: 14px;
      padding: 14px 16px;
      text-align: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .post-list-card.campus { box-shadow: 5px 5px 0 var(--campus-color), 5px 5px 0 1.5px #4d352e; }
    .post-list-card.government { box-shadow: 5px 5px 0 var(--gov-color), 5px 5px 0 1.5px #4d352e; }
    .post-list-card.diary { box-shadow: 5px 5px 0 var(--diary-color), 5px 5px 0 1.5px #4d352e; }

    .post-list-card:hover {
      transform: translate(-2px, -2px);
    }

    .post-list-card:active {
      transform: translate(2px, 2px);
    }

    .post-list-title {
      font-family: var(--font-pixel);
      font-size: 0.78rem;
      line-height: 1.45;
      color: var(--text-body);
      text-transform: uppercase;
    }

    .post-list-meta {
      font-family: var(--font-retro);
      font-size: 0.7rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* ================= VIEW 3: ARTICLE READER ================= */
    .article-layout {
      display: grid;
      grid-template-columns: 235px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
    }

    .article-sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 16px;
    }

    .article-character-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      min-height: 280px;
    }

    .article-character-img {
      max-height: 310px;
      width: auto;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(91, 83, 83, 0.14));
      transition: transform 0.25s ease;
    }

    .article-character-img:hover {
      transform: translateY(-4px);
    }

    .sidebar-progress-label {
      font-family: var(--font-retro);
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-transform: uppercase;
      width: 100%;
      display: flex;
      justify-content: space-between;
    }

    .comment-icon-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      border-radius: 12px;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .comment-icon-btn:hover {
      transform: translateY(-3px);
      background: rgba(242, 181, 190, 0.28);
    }

    .comment-icon-btn span {
      font-family: var(--font-pixel);
      font-size: 0.78rem;
      color: var(--text-body);
      letter-spacing: 0.08em;
    }

    .sidebar-nav-stack {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      margin-top: 4px;
    }

    .sidebar-nav-stack .retro-chip-btn {
      justify-content: center;
      width: 100%;
    }

    /* Article Main Window */
    .article-window {
      display: flex;
      flex-direction: column;
      height: min(78vh, 660px);
      min-height: 500px;
    }

    .article-header-title {
      font-family: var(--font-pixel);
      font-size: clamp(0.9rem, 1.75vw, 1.25rem);
      letter-spacing: 0.04em;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .article-theme-campus .retro-titlebar { background: var(--campus-color); color: var(--text-slate); }
    .article-theme-government .retro-titlebar { background: var(--gov-color); color: #fff8f2; }
    .article-theme-government .win-btn { color: #fff8f2; border-color: rgba(255, 248, 242, 0.65); }
    .article-theme-diary .retro-titlebar { background: var(--diary-color); color: var(--text-slate); }

    .article-window-inner {
      display: flex;
      flex: 1;
      min-height: 0;
      position: relative;
    }

    .article-scroll-content {
      flex: 1;
      overflow-y: auto;
      padding: 18px 24px 28px;
      scrollbar-width: none;
    }

    .article-scroll-content::-webkit-scrollbar {
      display: none;
    }

    /* Custom Retro Pink-Blue Scrollbar (Exact Canva Pages 3-5) */
    .retro-scrollbar {
      width: 24px;
      flex-shrink: 0;
      border-left: 2px solid var(--border-dark);
      background: var(--scroll-track);
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    .scroll-arrow-btn {
      height: 24px;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-cream);
      color: #8278b8;
      font-size: 11px;
      flex-shrink: 0;
      transition: background 0.12s;
    }

    .scroll-arrow-btn.top { border-bottom: 2px solid var(--border-dark); }
    .scroll-arrow-btn.bottom { border-top: 2px solid var(--border-dark); }
    .scroll-arrow-btn:hover { background: var(--pink-bar); color: var(--text-slate); }

    .scroll-track {
      flex: 1;
      position: relative;
      background: var(--scroll-track);
      cursor: pointer;
    }

    .scroll-thumb {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 45%;
      background: var(--scroll-thumb);
      border-bottom: 2px solid var(--border-dark);
      border-top: 2px solid var(--border-dark);
      cursor: grab;
      transition: background 0.12s;
    }

    .scroll-thumb:active {
      cursor: grabbing;
      background: var(--pink-progress);
    }

    .article-top-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 18px;
    }

    .article-meta-left {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .article-timestamp {
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .reaction-stack {
      display: flex;
      flex-direction: column;
      gap: 6px;
      align-items: flex-start;
    }

    .reaction-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 5px 10px;
      border-radius: 8px;
      border: 2px solid transparent;
      font-family: var(--font-retro);
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-body);
      transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .reaction-btn:hover {
      background: rgba(255, 255, 255, 0.75);
      border-color: var(--border-dark);
      transform: translateX(2px);
    }

    .reaction-btn.active-like {
      background: rgba(126, 119, 209, 0.16);
      border-color: var(--like-blue);
      color: var(--like-blue);
    }

    .reaction-btn.active-dislike {
      background: rgba(182, 76, 69, 0.14);
      border-color: var(--dislike-red);
      color: var(--dislike-red);
    }

    .reaction-btn.pop {
      animation: popScale 0.25s ease;
    }

    @keyframes popScale {
      0% { transform: scale(1); }
      50% { transform: scale(1.16); }
      100% { transform: scale(1); }
    }

    /* Chamfered Article Banner (Matches Pages 3-5) */
    .article-banner-frame {
      width: min(100%, 470px);
      margin: 0 auto 22px;
      border-radius: 28px;
      clip-path: polygon(
        18px 0%, calc(100% - 18px) 0%,
        100% 18px, 100% calc(100% - 18px),
        calc(100% - 18px) 100%, 18px 100%,
        0% calc(100% - 18px), 0% 18px
      );
      overflow: hidden;
      background: #dff3ff;
      box-shadow: 0 4px 12px rgba(91, 83, 83, 0.12);
    }

    .article-banner-frame img.custom-banner-img {
      width: 100%;
      max-height: 240px;
      object-fit: cover;
    }

    .article-prose {
      font-size: 0.98rem;
      line-height: 1.85;
      color: var(--text-body);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .article-bottom-bar {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 2px dashed rgba(91, 83, 83, 0.35);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    /* ================= VIEW 4: COMMENTS (Page 8) ================= */
    .comments-window .retro-titlebar {
      background: var(--comment-bar);
      color: var(--text-slate);
    }

    .comments-body {
      padding: 22px 26px 26px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .comments-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 12px;
      border-bottom: 2px dashed rgba(91, 83, 83, 0.28);
    }

    /* Threaded Pin Tree (Exact Page 8 Design) */
    .comment-tree {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .comment-thread {
      position: relative;
    }

    .comment-node {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      position: relative;
    }

    .pin-connector-main {
      display: flex;
      align-items: center;
      margin-top: 5px;
      flex-shrink: 0;
    }

    .pin-stem-h {
      width: 16px;
      height: 2px;
      background: var(--border-dark);
    }

    .pin-dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--comment-bar);
      border: 2px solid var(--border-dark);
      flex-shrink: 0;
    }

    .comment-content-box {
      flex: 1;
      min-width: 0;
    }

    .comment-author-line {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 4px;
    }

    .comment-author-name {
      font-family: var(--font-pixel);
      font-size: 0.8rem;
      color: var(--text-slate);
      text-transform: uppercase;
    }

    .comment-time {
      font-family: var(--font-retro);
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .comment-text {
      font-family: var(--font-retro);
      font-size: 0.94rem;
      line-height: 1.5;
      color: var(--text-body);
    }

    /* Author Reply Branch — ONLY shown when comment.reply exists! */
    .reply-branch {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-left: 8px;
      margin-top: 8px;
      position: relative;
    }

    .reply-l-line {
      width: 16px;
      height: 20px;
      border-left: 2px solid var(--border-dark);
      border-bottom: 2px solid var(--border-dark);
      flex-shrink: 0;
      margin-top: -6px;
    }

    .reply-pin-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--comment-bar);
      border: 2px solid var(--border-dark);
      margin-top: 7px;
      flex-shrink: 0;
    }

    .reply-box {
      flex: 1;
      background: rgba(242, 181, 190, 0.22);
      border: 1.5px solid rgba(91, 83, 83, 0.35);
      padding: 8px 12px;
      border-radius: 8px;
    }

    .author-badge {
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      background: var(--pink-bar);
      color: var(--text-slate);
      border: 1.5px solid var(--border-dark);
      padding: 2px 6px;
      text-transform: uppercase;
    }

    .reply-action-row {
      margin-top: 6px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .mini-action-btn {
      font-family: var(--font-retro);
      font-size: 0.74rem;
      font-weight: 700;
      padding: 4px 10px;
      border: 1.5px solid var(--border-dark);
      background: #fff;
      color: var(--text-slate);
    }

    .mini-action-btn:hover {
      background: var(--mint-bar);
    }

    .mini-action-btn.danger:hover {
      background: #f5c2c0;
    }

    /* New Comment Form */
    .comment-form {
      background: rgba(255, 255, 255, 0.7);
      border: 2px solid var(--border-dark);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .comment-form-title {
      font-family: var(--font-pixel);
      font-size: 0.8rem;
      color: var(--text-slate);
    }

    .retro-input, .retro-textarea, .retro-select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid var(--border-dark);
      background: #fff;
      font-family: var(--font-body);
      font-size: 0.9rem;
      color: var(--text-body);
    }

    .retro-textarea {
      min-height: 76px;
      resize: vertical;
    }

    .retro-submit-btn {
      align-self: flex-end;
      font-family: var(--font-pixel);
      font-size: 0.78rem;
      padding: 10px 18px;
      background: var(--comment-bar);
      color: #fff;
      border: 2px solid var(--border-dark);
      box-shadow: 3px 3px 0 var(--border-dark);
      transition: transform 0.12s;
    }

    .retro-submit-btn:hover {
      transform: translate(-1px, -1px);
    }

    /* ================= VIEW 5: BIO (Page 6) ================= */
    .bio-layout {
      display: grid;
      grid-template-columns: minmax(260px, 340px) minmax(0, 1fr);
      gap: 32px;
      align-items: start;
    }

    .bio-photo-window .retro-titlebar {
      background: var(--mint-bar);
      color: var(--text-slate);
      min-height: 44px;
      padding: 8px 12px;
    }

    .bio-photo-title {
      font-family: var(--font-pixel);
      font-size: 1.25rem;
      letter-spacing: 0.06em;
    }

    .bio-photo-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bio-photo-frame {
      width: 100%;
      border: 2px solid rgba(91, 83, 83, 0.25);
      overflow: hidden;
      background: #fff;
    }

    .bio-photo-frame img {
      width: 100%;
      aspect-ratio: 420 / 530;
      object-fit: cover;
    }

    .bio-send-bar {
      display: flex;
      border: 2px solid var(--border-dark);
      background: #fff;
    }

    .bio-send-input {
      flex: 1;
      border: none;
      padding: 8px 10px;
      font-family: var(--font-retro);
      font-size: 0.82rem;
      color: var(--text-slate);
      background: transparent;
      min-width: 0;
    }

    .bio-send-btn {
      padding: 8px 14px;
      background: var(--mint-bar);
      border-left: 2px solid var(--border-dark);
      font-family: var(--font-retro);
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--text-slate);
      transition: background 0.15s;
    }

    .bio-send-btn:hover {
      background: #84c0b2;
    }

    .bio-send-hint {
      font-family: var(--font-retro);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
    }

    .bio-text-column {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-top: 2px;
    }

    .bio-identity-header {
      text-align: center;
      font-family: var(--font-pixel);
      font-size: 0.9rem;
      line-height: 1.7;
      color: var(--text-slate);
      padding-bottom: 10px;
      border-bottom: 2px dashed rgba(91, 83, 83, 0.25);
    }

    .bio-paragraph {
      font-family: var(--font-retro);
      font-size: clamp(0.92rem, 1.45vw, 1.04rem);
      font-weight: 600;
      line-height: 1.65;
      letter-spacing: 0.04em;
      color: var(--text-body);
      text-transform: uppercase;
    }

    .bio-action-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    /* ================= VIEW 6: THANK YOU / CONTACT (Page 7 Revised) ================= */
    .thankyou-window .retro-titlebar {
      background: var(--pink-bar);
      min-height: 44px;
      justify-content: flex-end;
    }

    .thankyou-body {
      padding: 40px 28px 34px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      min-height: 450px;
      justify-content: center;
    }

    .thankyou-headline {
      font-family: var(--font-pixel);
      font-size: clamp(1.5rem, 4.2vw, 2.85rem);
      color: #6b6b6b;
      line-height: 1.25;
      letter-spacing: 0.05em;
    }

    .thankyou-submsg {
      font-family: var(--font-pixel);
      font-size: clamp(0.8rem, 1.6vw, 1.02rem);
      color: #6b6b6b;
      line-height: 1.55;
      max-width: 640px;
      letter-spacing: 0.04em;
    }

    .thankyou-progress {
      width: min(100%, 320px);
      margin: 4px auto;
    }

    .thankyou-contact {
      display: flex;
      flex-direction: column;
      gap: 7px;
      font-family: var(--font-retro);
      font-size: 0.92rem;
      letter-spacing: 0.16em;
      color: var(--text-body);
      text-transform: uppercase;
    }

    .contact-copy-btn {
      font-family: var(--font-pixel);
      font-size: 0.92rem;
      color: var(--text-slate);
      padding: 4px 10px;
      border-radius: 6px;
      transition: background 0.15s;
    }

    .contact-copy-btn:hover {
      background: rgba(242, 181, 190, 0.45);
    }

    .thankyou-feedback-form {
      width: min(100%, 460px);
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    /* ================= VIEW 7: ADMIN STUDIO (Password 9865) ================= */
    .admin-window .retro-titlebar {
      background: var(--mint-bar);
      color: var(--text-slate);
    }

    .admin-body {
      padding: 20px 24px 26px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .admin-top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 14px;
      border-bottom: 2px dashed rgba(91, 83, 83, 0.3);
    }

    .admin-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .admin-tab-btn {
      font-family: var(--font-retro);
      font-size: 0.82rem;
      font-weight: 700;
      padding: 8px 14px;
      border: 2px solid var(--border-dark);
      background: #fff;
      color: var(--text-slate);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: background 0.14s, transform 0.12s;
    }

    .admin-tab-btn:hover {
      background: rgba(242, 181, 190, 0.4);
    }

    .admin-tab-btn.active {
      background: var(--pink-bar);
      box-shadow: 3px 3px 0 var(--border-dark);
    }

    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .stat-card {
      background: #fff;
      border: 2px solid var(--border-dark);
      padding: 12px 14px;
      box-shadow: 4px 4px 0 rgba(91, 83, 83, 0.12);
    }

    .stat-label {
      font-family: var(--font-retro);
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .stat-value {
      font-family: var(--font-pixel);
      font-size: 1.35rem;
      color: var(--text-slate);
      margin-top: 4px;
    }

    .admin-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .admin-item-card {
      background: #fff;
      border: 2px solid var(--border-dark);
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 4px 4px 0 rgba(91, 83, 83, 0.1);
    }

    .admin-item-info {
      flex: 1;
      min-width: 220px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .theme-badge {
      display: inline-block;
      font-family: var(--font-retro);
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 8px;
      border: 1.5px solid var(--border-dark);
      width: fit-content;
      text-transform: uppercase;
    }

    .theme-badge.campus { background: var(--campus-color); color: var(--text-slate); }
    .theme-badge.government { background: var(--gov-color); color: #fff; }
    .theme-badge.diary { background: var(--diary-color); color: var(--text-slate); }

    .admin-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .music-panel {
      background: #fff;
      border: 2px solid var(--border-dark);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .music-controls-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
    }

    .upload-drop-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--font-pixel);
      font-size: 0.78rem;
      padding: 10px 16px;
      background: var(--mint-bar);
      border: 2px solid var(--border-dark);
      box-shadow: 3px 3px 0 var(--border-dark);
      cursor: pointer;
      color: var(--text-slate);
    }

    .upload-drop-label:hover {
      background: #84c0b2;
    }

    /* ================= MODALS ================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(61, 74, 87, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 900;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-card {
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
    }

    .modal-card.small {
      max-width: 380px;
    }

    .modal-card .retro-titlebar {
      background: var(--pink-bar);
    }

    .modal-form {
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .field-label {
      font-family: var(--font-retro);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-slate);
      text-transform: uppercase;
      margin-bottom: 4px;
      display: block;
    }

    .img-preview-box {
      border: 2px dashed var(--border-dark);
      padding: 8px;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .img-preview-box img {
      max-height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    /* Toast Notification */
    .toast-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-slate);
      color: #fff;
      font-family: var(--font-retro);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      padding: 10px 18px;
      border: 2px solid #fff;
      box-shadow: 4px 4px 0 var(--pink-progress);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 1000;
      max-width: 90vw;
      text-align: center;
    }

    .toast-box.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ================= RESPONSIVE ================= */
    @media (max-width: 880px) {
      .home-grid {
        grid-template-columns: 1fr;
      }
      .posts-columns {
        grid-template-columns: 1fr;
      }
      .article-layout {
        grid-template-columns: 1fr;
      }
      .article-sidebar {
        position: static;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        background: rgba(255, 255, 255, 0.55);
        border: 2px solid var(--border-dark);
        padding: 12px;
      }
      .article-character-wrap {
        min-height: auto;
        width: 110px;
      }
      .article-character-img {
        max-height: 135px;
      }
      .article-window {
        height: 70vh;
        min-height: 440px;
      }
      .bio-layout {
        grid-template-columns: 1fr;
      }
      .bio-photo-window {
        max-width: 340px;
        margin: 0 auto;
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .home-body {
        padding: 16px;
      }
      .home-hero-row {
        flex-direction: column;
        gap: 14px;
      }
      .thankyou-feedback-form {
        flex-direction: column;
      }
    }
  </style>

<body>
  <!-- Floating Controls (Sound toggle on inner pages + Admin Studio quick access when logged in) -->
  <div id="floatingControls" class="floating-controls"></div>

  <div class="app-shell">
    <main id="appRoot" class="view-container" aria-live="polite"></main>
  </div>

  <!-- Password Modal (Hidden behind "MY BLOG AS AN WNI") -->
  <div id="passwordModal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="pwModalTitle">
    <div class="retro-window modal-card small">
      <div class="retro-titlebar">
        <span id="pwModalTitle" style="font-family:var(--font-pixel);font-size:0.85rem;color:var(--text-slate);">🔒 AKSES MENU PENGEDITAN</span>
        <div class="window-controls">
          <button type="button" class="win-btn" id="closePwModalBtn" aria-label="Tutup">×</button>
        </div>
      </div>
      <form id="passwordForm" class="modal-form">
        <p style="font-family:var(--font-retro);font-size:0.86rem;color:var(--text-muted);">
          Masukkan password admin untuk membuka menu pengeditan MEWNIBLOG.
        </p>
        <div>
          <label class="field-label" for="adminPasswordInput">Password</label>
          <div style="display:flex;gap:6px;">
            <input id="adminPasswordInput" name="mewni_pin_code" class="retro-input" type="password" inputmode="numeric" placeholder="Masukkan 4 angka" required autocomplete="new-password" style="flex:1;">
            <button type="button" class="retro-chip-btn" id="togglePwVisBtn" style="padding:6px 10px;white-space:nowrap;">👁 Lihat</button>
          </div>
          <p id="pwErrorMsg" style="font-family:var(--font-retro);font-size:0.78rem;color:var(--dislike-red);margin-top:6px;display:none;">
            Password salah! Coba lagi.
          </p>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px;">
          <button type="button" class="retro-chip-btn" id="cancelPwBtn">Batal</button>
          <button type="submit" class="retro-submit-btn">MASUK ADMIN</button>
        </div>
      </form>
    </div>

      <div class="retro-titlebar">
        <span id="editorModalTitle" style="font-family:var(--font-pixel);font-size:0.88rem;color:var(--text-slate);">+ TULIS ARTIKEL BARU</span>
        <div class="window-controls">
          <button type="button" class="win-btn" id="closeEditorModalBtn" aria-label="Tutup">×</button>

      </div>

        <input type="hidden" id="editPostIdInput" value="">
        <div>
          <label class="field-label" for="postThemeInput">Pilih Tema</label>

            <option value="campus">Campus Activities (Biru • Kaguya)</option>
            <option value="government">Indonesian Government (Ungu • Shuna)</option>
            <option value="diary">My Kisah Guweh (Oranye • Maomao)</option>

            </div>
          </div>

      // ================= STATE MANAGEMENT =================
      function loadState() {
        const fallback = {
          posts: JSON.parse(JSON.stringify(DEFAULT_POSTS)),
          reactions: {},
          readPosts: [],
          inbox: JSON.parse(JSON.stringify(DEFAULT_INBOX)),
          musicName: 'Default Cozy Retro Music Box (Bawaan)',
          musicVolume: 0.45
        };
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return fallback;
          const parsed = JSON.parse(raw);
          if (!parsed || !Array.isArray(parsed.posts) || parsed.posts.length === 0) return fallback;
          return {
            posts: parsed.posts,
            reactions: parsed.reactions || {},
            readPosts: Array.isArray(parsed.readPosts) ? parsed.readPosts : [],
            inbox: Array.isArray(parsed.inbox) ? parsed.inbox : fallback.inbox,
            musicName: parsed.musicName || fallback.musicName,
            musicVolume: typeof parsed.musicVolume === 'number' ? parsed.musicVolume : 0.45
          };
        } catch (e) {
          return fallback;
        }
      }

      function saveState() {
        try {

      // ================= BACKSOUND AUDIO ENGINE =================
      const customAudioEl = document.getElementById('customBgmAudio');
      let customAudioUrl = null;
      let isMusicPlaying = false;
      let synthCtx = null;
      let synthInterval = null;
      let synthStep = 0;

      // Cozy pastel lo-fi music-box notes (C major 7 / Am7 / Fmaj7 / G6)
      const MELODY_NOTES = [
        523.25, 659.25, 783.99, 987.77,
        440.00, 523.25, 659.25, 783.99,
        349.23, 440.00, 523.25, 659.25,
        392.00, 493.88, 587.33, 659.25
      ];

      function playSynthNote(freq) {
        if (!synthCtx || synthCtx.state !== 'running') return;
        const now = synthCtx.currentTime;
        const osc = synthCtx.createOscillator();
        const gain = synthCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(freq, now);
        const vol = Math.max(0.02, state.musicVolume * 0.14);
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(vol, now + 0.04);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.72);
        osc.connect(gain);
        gain.connect(synthCtx.destination);
        osc.start(now);
        osc.stop(now + 0.75);
      }

      function startBgm() {
        if (customAudioUrl) {
          stopSynth();
          customAudioEl.volume = state.musicVolume;
          customAudioEl.play().then(() => {
            isMusicPlaying = true;
            updateSoundUI();
          }).catch(() => {
            showToast('Klik ikon speaker untuk memutar backsound.');
          });
        } else {
          try {
            if (!synthCtx) {
              const AudioCtx = window.AudioContext || window.webkitAudioContext;
              synthCtx = new AudioCtx();
            }
            if (synthCtx.state === 'suspended') {
              synthCtx.resume();
            }
            stopSynth();
            playSynthNote(MELODY_NOTES[synthStep % MELODY_NOTES.length]);
            synthStep++;
            synthInterval = setInterval(() => {
              playSynthNote(MELODY_NOTES[synthStep % MELODY_NOTES.length]);
              synthStep++;
            }, 520);
            isMusicPlaying = true;
            updateSoundUI();
          } catch (e) {
            showToast('Browser tidak mendukung audio bawaan.');
          }
        }
      }

      function stopSynth() {
        if (synthInterval) {
          clearInterval(synthInterval);
          synthInterval = null;
        }
      }

      function stopBgm() {
        stopSynth();
        try {
          customAudioEl.pause();
        } catch (e) {}
        isMusicPlaying = false;
        updateSoundUI();
      }

      function toggleBgm() {
        if (isMusicPlaying) {
          stopBgm();
          showToast('Backsound di-mute.');
        } else {
          startBgm();
          showToast('Memutar: ' + state.musicName);
        }
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatNow() {
        const now = new Date();
        const pad = n => String(n).padStart(2, '0');
        const months = ['JAN', 'FEB', 'MAR', 'APR', 'MEI', 'JUN', 'JUL', 'AGU', 'SEP', 'OKT', 'NOV', 'DES'];
        return `${pad(now.getDate())} ${months[now.getMonth()]} ${now.getFullYear()} • ${pad(now.getHours())}:${pad(now.getMinutes())} WIB`;
      }

      function copyText(text, label) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(() => {
            showToast(label + ' disalin ke clipboard!');
          }).catch(() => fallbackCopy(text, label));
        } else {
          fallbackCopy(text, label);
        }
      }

      function fallbackCopy(text, label) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try {
          document.execCommand('copy');
          showToast(label + ' disalin ke clipboard!');
        } catch (e) {
          showToast(label + ': ' + text);
        }
        document.body.removeChild(ta);
      }

        let count = 0;
        state.posts.forEach(p => {

        });
        state.inbox.forEach(m => {
          if (!m.isRead) count++;
        });
        return count;
      }

          document.getElementById('winBtnHome').addEventListener('click', () => navigate('home'));
        }

        const nextBtn = document.getElementById('btnNextThemePost');
        if (nextBtn && nextPost) {
          nextBtn.addEventListener('click', () => navigate('article', nextPost.id));
        }

        // Interactive Like & Dislike
        const btnLike = document.getElementById('btnLike');
        const btnDislike = document.getElementById('btnDislike');

        function handleReaction(type) {
          const prev = state.reactions[post.id] || null;
          if (prev === type) {
            state.reactions[post.id] = null;
            if (type === 'like') post.likes = Math.max(0, post.likes - 1);
            else post.dislikes = Math.max(0, post.dislikes - 1);
          } else {
            if (prev === 'like') post.likes = Math.max(0, post.likes - 1);
            if (prev === 'dislike') post.dislikes = Math.max(0, post.dislikes - 1);
            state.reactions[post.id] = type;
            if (type === 'like') post.likes += 1;
            else post.dislikes += 1;
          }
          saveState();
          updateReactionUI(type);
        }

        function updateReactionUI(clickedType) {
          const current = state.reactions[post.id] || null;
          btnLike.className = 'reaction-btn' + (current === 'like' ? ' active-like' : '') + (clickedType === 'like' ? ' pop' : '');
          btnDislike.className = 'reaction-btn' + (current === 'dislike' ? ' active-dislike' : '') + (clickedType === 'dislike' ? ' pop' : '');
          btnLike.setAttribute('aria-pressed', String(current === 'like'));
          btnDislike.setAttribute('aria-pressed', String(current === 'dislike'));
          btnLike.querySelector('svg').setAttribute('fill', current === 'like' ? '#7e77d1' : 'none');
          btnDislike.querySelector('svg').setAttribute('fill', current === 'dislike' ? '#b64c45' : 'none');
          document.getElementById('likeCountLabel').textContent = `${post.likes} LIKE`;
          document.getElementById('dislikeCountLabel').textContent = `${post.dislikes} DISLIKE`;
        }

        btnLike.addEventListener('click', () => handleReaction('like'));
        btnDislike.addEventListener('click', () => handleReaction('dislike'));

        // Custom Retro Scrollbar + Reading Progress Bar Sync
        const scrollArea = document.getElementById('articleScrollArea');
        const scrollTrack = document.getElementById('scrollTrack');
        const scrollThumb = document.getElementById('scrollThumb');
        const scrollUpBtn = document.getElementById('scrollUpBtn');
        const scrollDownBtn = document.getElementById('scrollDownBtn');
        const readProgressEl = document.getElementById('articleReadProgress');
        const readPercentLabel = document.getElementById('readPercentLabel');

        function syncScrollbar() {
          const maxScroll = scrollArea.scrollHeight - scrollArea.clientHeight;
          const trackHeight = scrollTrack.clientHeight || 1;
          if (maxScroll <= 0) {
            scrollThumb.style.height = '100%';
            scrollThumb.style.top = '0px';
            readProgressEl.innerHTML = renderProgressSegments(16, 16);
            readPercentLabel.textContent = '100%';
            return;
          }
          const visibleRatio = scrollArea.clientHeight / scrollArea.scrollHeight;
          const thumbHeight = Math.max(38, visibleRatio * trackHeight);
          const scrollRatio = scrollArea.scrollTop / maxScroll;
          const maxThumbTop = trackHeight - thumbHeight;

          scrollThumb.style.height = thumbHeight + 'px';
          scrollThumb.style.top = (scrollRatio * maxThumbTop) + 'px';

          const pct = Math.min(100, Math.max(10, Math.round(scrollRatio * 100)));
          const segs = Math.max(2, Math.round((pct / 100) * 16));
          readProgressEl.innerHTML = renderProgressSegments(segs, 16);
          readPercentLabel.textContent = pct + '%';
        }

        scrollArea.addEventListener('scroll', syncScrollbar);
        window.addEventListener('resize', syncScrollbar);

        scrollUpBtn.addEventListener('click', () => {
          scrollArea.scrollBy({ top: -110, behavior: 'smooth' });
        });
        scrollDownBtn.addEventListener('click', () => {
          scrollArea.scrollBy({ top: 110, behavior: 'smooth' });
        });

        scrollTrack.addEventListener('click', (e) => {
          if (e.target === scrollThumb) return;
          const rect = scrollTrack.getBoundingClientRect();
          const clickY = e.clientY - rect.top;
          const ratio = clickY / Math.max(1, rect.height);
          scrollArea.scrollTo({
            top: ratio * (scrollArea.scrollHeight - scrollArea.clientHeight),
            behavior: 'smooth'
          });
        });

        let dragging = false;
        let dragStartY = 0;
        let dragStartScroll = 0;

        function onPointerMove(e) {
          if (!dragging) return;
          const maxScroll = scrollArea.scrollHeight - scrollArea.clientHeight;
          const maxThumbTop = Math.max(1, scrollTrack.clientHeight - scrollThumb.clientHeight);
          const deltaY = e.clientY - dragStartY;
          scrollArea.scrollTop = dragStartScroll + (deltaY / maxThumbTop) * maxScroll;
        }

        function onPointerUp() {
          dragging = false;
        }

        scrollThumb.addEventListener('mousedown', (e) => {
          e.preventDefault();
          dragging = true;
          dragStartY = e.clientY;
          dragStartScroll = scrollArea.scrollTop;
        });

        window.addEventListener('mousemove', onPointerMove);
        window.addEventListener('mouseup', onPointerUp);

        activeScrollCleanup = () => {
          window.removeEventListener('resize', syncScrollbar);
          window.removeEventListener('mousemove', onPointerMove);
          window.removeEventListener('mouseup', onPointerUp);
        };

        requestAnimationFrame(syncScrollbar);
      }

              <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
                <label for="adminVolumeSlider" style="font-family:var(--font-retro);font-size:0.84rem;font-weight:700;">Volume: <span id="volLabel">${Math.round(state.musicVolume * 100)}%</span></label>
                <input type="range" id="adminVolumeSlider" min="5" max="100" value="${Math.round(state.musicVolume * 100)}" style="width:200px;accent-color:var(--gov-color);">
              </div>
              <p style="font-family:var(--font-retro);font-size:0.8rem;color:var(--text-muted);">
                Tip: Pembaca bisa menekan tombol speaker di pojok kiri atas halaman utama (atau tombol BGM di halaman lain) untuk mute/unmute kapan saja.
              </p>
            </div>
          `;
        }

        appRoot.innerHTML = `
          <section class="retro-window admin-window" aria-label="Menu Pengeditan Admin MEWNIBLOG">
            <div class="retro-titlebar">
              <span style="font-family:var(--font-pixel);font-size:0.95rem;color:var(--text-slate);">⚙ MENU PENGEDITAN — ADMIN ALIVIA</span>
              <div class="window-controls">
                <button type="button" class="win-btn" id="adminCloseBtn" title="Kembali ke Blog" aria-label="Kembali ke beranda">×</button>
              </div>
            </div>
            <div class="admin-body">
              <div class="admin-stats-grid">
                <div class="stat-card">
                  <div class="stat-label">Total Artikel</div>
                  <div class="stat-value">${state.posts.length}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Komen Belum Dibalas</div>
                  <div class="stat-value">${unrepliedCount}</div>
                </div>
                <div class="stat-card">
                  <div class="stat-label">Chat Kritik Baru</div>
                  <div class="stat-value">${unreadInboxCount}</div>
                </div>
              </div>

              <div class="admin-top-bar">
                <div class="admin-tabs">
                  <button type="button" class="admin-tab-btn ${tab === 'posts' ? 'active' : ''}" data-admin-tab="posts">📝 ARTIKEL</button>
                  <button type="button" class="admin-tab-btn ${tab === 'comments' ? 'active' : ''}" data-admin-tab="comments">
                    🔔 KOMENTAR ${unrepliedCount > 0 ? `<span class="notif-dot">${unrepliedCount}</span>` : ''}
                  </button>
                  <button type="button" class="admin-tab-btn ${tab === 'inbox' ? 'active' : ''}" data-admin-tab="inbox">
                    💌 CHAT KRITIK ${unreadInboxCount > 0 ? `<span class="notif-dot">${unreadInboxCount}</span>` : ''}
                  </button>
                  <button type="button" class="admin-tab-btn ${tab === 'music' ? 'active' : ''}" data-admin-tab="music">🎵 BACKSOUND</button>
                </div>

                <div style="display:flex;gap:8px;flex-wrap:wrap;">
                  <button type="button" class="retro-chip-btn" id="adminPreviewBlogBtn">👁 LIHAT BLOG</button>
                  <button type="button" class="retro-chip-btn danger" id="adminLogoutBtn">KELUAR MODE ADMIN</button>
                </div>
              </div>

              <div>
                ${tabContentHtml}
              </div>
            </div>
          </section>
        `;

        document.getElementById('adminCloseBtn').addEventListener('click', () => navigate('home'));
        document.getElementById('adminPreviewBlogBtn').addEventListener('click', () => navigate('home'));
        document.getElementById('adminLogoutBtn').addEventListener('click', () => {
          isAdminLoggedIn = false;
          showToast('Keluar dari Mode Admin. Sekarang tampilan versi pembaca.');
          navigate('home');
        });

        appRoot.querySelectorAll('[data-admin-tab]').forEach(btn => {
          btn.addEventListener('click', () => navigate('admin', null, btn.getAttribute('data-admin-tab')));
        });

        if (tab === 'posts') {
          document.getElementById('adminBtnNewPost').addEventListener('click', () => openPostEditor(null));
          appRoot.querySelectorAll('[data-admin-view]').forEach(btn => {
            btn.addEventListener('click', () => navigate('article', btn.getAttribute('data-admin-view')));
          });
          appRoot.querySelectorAll('[data-admin-photo]').forEach(btn => {
            btn.addEventListener('click', () => {
              quickPhotoTargetPostId = btn.getAttribute('data-admin-photo');
              document.getElementById('quickArticlePhotoInput').click();
            });
          });
          appRoot.querySelectorAll('[data-admin-edit]').forEach(btn => {
            btn.addEventListener('click', () => {
              const p = getPostById(btn.getAttribute('data-admin-edit'));
              if (p) openPostEditor(p);
            });
          });
          appRoot.querySelectorAll('[data-admin-delete]').forEach(btn => {
            btn.addEventListener('click', () => {
              const pid = btn.getAttribute('data-admin-delete');
              const p = getPostById(pid);
              if (!p) return;
              askDeleteConfirm(`Yakin ingin menghapus artikel "${p.title}"?`, () => {
                state.posts = state.posts.filter(item => item.id !== pid);
                saveState();
                showToast('Artikel dihapus!');
                renderAdmin();
              });
            });
          });
        } else if (tab === 'comments') {
          appRoot.querySelectorAll('[data-adm-save-reply]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [pid, cid] = btn.getAttribute('data-adm-save-reply').split('|');
              const p = getPostById(pid);
              const c = p && p.comments.find(x => x.id === cid);
              const input = document.getElementById(`admReplyInput-${pid}-${cid}`);
              if (c && input) {
                c.reply = input.value.trim();
                c.isReadByAdmin = true;
                saveState();
                showToast(c.reply ? 'Balasan Alivia disimpan!' : 'Balasan dikosongkan.');
                renderAdmin();
              }
            });
          });
          appRoot.querySelectorAll('[data-adm-clear-reply]').forEach(btn => {
            btn.addEventListener('click', () => {
              const [pid, cid] = btn.getAttribute('data-adm-clear-reply').split('|');
              const p = getPostById(pid);
              const c = p && p.comments.find(x => x.id === cid);
              if (c) {
                c.reply = '';
                c.isReadByAdmin = true;
                saveState();
                showToast('Balasan dihapus & pin reply dihilangkan.');
                renderAdmin();
              }
            });
          });
        } else if (tab === 'inbox') {
          appRoot.querySelectorAll('[data-inbox-read]').forEach(btn => {
            btn.addEventListener('click', () => {
              const mid = btn.getAttribute('data-inbox-read');
              const m = state.inbox.find(x => x.id === mid);
              if (m) {
                m.isRead = true;
                saveState();
                renderAdmin();
              }
            });
          });
          appRoot.querySelectorAll('[data-inbox-del]').forEach(btn => {
            btn.addEventListener('click', () => {
              const mid = btn.getAttribute('data-inbox-del');
              state.inbox = state.inbox.filter(x => x.id !== mid);
              saveState();
              showToast('Pesan dihapus.');
              renderAdmin();
            });
          });
        } else if (tab === 'music') {
          document.getElementById('adminTogglePlayBgm').addEventListener('click', () => {
            toggleBgm();
            renderAdmin();
          });

          const volSlider = document.getElementById('adminVolumeSlider');
          volSlider.addEventListener('input', () => {
            state.musicVolume = Number(volSlider.value) / 100;
            customAudioEl.volume = state.musicVolume;
            document.getElementById('volLabel').textContent = volSlider.value + '%';
            saveState();
          });

          const uploadInput = document.getElementById('adminMusicUploadInput');
          uploadInput.addEventListener('change', (e) => {
            const file = e.target.files && e.target.files[0];
            if (!file) return;
            if (customAudioUrl) URL.revokeObjectURL(customAudioUrl);
            customAudioUrl = URL.createObjectURL(file);
            customAudioEl.src = customAudioUrl;
            state.musicName = file.name;
            saveState();
            startBgm();
            showToast('Backsound diganti ke: ' + file.name);
            renderAdmin();
          });

          const resetBtn = document.getElementById('adminResetDefaultBgm');
          if (resetBtn) {
            resetBtn.addEventListener('click', () => {
              stopBgm();
              if (customAudioUrl) URL.revokeObjectURL(customAudioUrl);
              customAudioUrl = null;
              customAudioEl.removeAttribute('src');
              state.musicName = 'Default Cozy Retro Music Box (Bawaan)';
              saveState();
              showToast('Kembali ke backsound bawaan.');
              renderAdmin();
            });
          }
        }
      }

      // ================= PASSWORD MODAL =================
      const pwModal = document.getElementById('passwordModal');
      const pwInput = document.getElementById('adminPasswordInput');
      const pwError = document.getElementById('pwErrorMsg');

      const togglePwVisBtn = document.getElementById('togglePwVisBtn');
      togglePwVisBtn.addEventListener('click', () => {
        const isHidden = pwInput.type === 'password';
        pwInput.type = isHidden ? 'text' : 'password';
        togglePwVisBtn.textContent = isHidden ? '🙈 Sembunyi' : '👁 Lihat';
      });

      function openPasswordModal() {
        pwInput.type = 'password';
        togglePwVisBtn.textContent = '👁 Lihat';
        pwInput.value = '';
        pwError.style.display = 'none';
        pwModal.classList.remove('hidden');
        setTimeout(() => { pwInput.value = ''; pwInput.focus(); }, 30);
      }

      function closePasswordModal() {
        pwModal.classList.add('hidden');
      }

      document.getElementById('closePwModalBtn').addEventListener('click', closePasswordModal);
      document.getElementById('cancelPwBtn').addEventListener('click', closePasswordModal);
      pwModal.addEventListener('click', (e) => {
        if (e.target === pwModal) closePasswordModal();
      });

      document.getElementById('passwordForm').addEventListener('submit', (e) => {
        e.preventDefault();
        if (pwInput.value.trim() === ADMIN_PASS) {
          isAdminLoggedIn = true;
          closePasswordModal();
          showToast('Selamat datang di Menu Pengeditan, Alivia!');
          navigate('admin', null, 'posts');
        } else {
          pwError.style.display = 'block';
          pwInput.select();
        }
      });

      // ================= POST EDITOR MODAL (CREATE & EDIT + PHOTO) =================
      const editorModal = document.getElementById('postEditorModal');
      const photoPreviewEl = document.getElementById('postPhotoPreview');
      const clearPhotoBtn = document.getElementById('clearPostPhotoBtn');
      const photoFileInput = document.getElementById('postPhotoFileInput');

      function openPostEditor(post) {
        editorPhotoBuffer = post ? (post.imageData || '') : '';
        document.getElementById('editPostIdInput').value = post ? post.id : '';
        document.getElementById('editorModalTitle').textContent = post ? '✎ EDIT ARTIKEL' : '+ TULIS ARTIKEL BARU';
        document.getElementById('savePostBtn').textContent = post ? 'SIMPAN PERUBAHAN' : 'PUBLISH ARTIKEL';
        document.getElementById('postThemeInput').value = post ? post.theme : 'campus';
        document.getElementById('postTitleInput').value = post ? post.title : '';
        document.getElementById('postContentInput').value = post ? post.paragraphs.join('\n\n') : '';
        photoFileInput.value = '';
        syncEditorPhotoPreview();
        editorModal.classList.remove('hidden');
        document.getElementById('postTitleInput').focus();
      }

      function syncEditorPhotoPreview() {
        if (editorPhotoBuffer) {
          photoPreviewEl.src = editorPhotoBuffer;
          photoPreviewEl.style.display = 'block';
          clearPhotoBtn.style.display = 'inline-block';
        } else {
          photoPreviewEl.src = '';
          photoPreviewEl.style.display = 'none';
          clearPhotoBtn.style.display = 'none';
        }
      }

      function closePostEditor() {
        editorModal.classList.add('hidden');
      }

      document.getElementById('closeEditorModalBtn').addEventListener('click', closePostEditor);
      document.getElementById('cancelEditorBtn').addEventListener('click', closePostEditor);
      editorModal.addEventListener('click', (e) => {
        if (e.target === editorModal) closePostEditor();
      });

      photoFileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          editorPhotoBuffer = reader.result;
          syncEditorPhotoPreview();
        };
        reader.readAsDataURL(file);
      });

      clearPhotoBtn.addEventListener('click', () => {
        editorPhotoBuffer = '';
        photoFileInput.value = '';
        syncEditorPhotoPreview();
      });

      document.getElementById('postEditorForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const editId = document.getElementById('editPostIdInput').value;
        const theme = document.getElementById('postThemeInput').value;
        const title = document.getElementById('postTitleInput').value.trim().toUpperCase();
        const rawContent = document.getElementById('postContentInput').value.trim();
        if (!title || !rawContent) return;

        const paragraphs = rawContent
          .split(/\n\s*\n/)
          .map(p => p.trim())
          .filter(Boolean);

        if (editId) {
          const existing = state.posts.find(p => p.id === editId);
          if (existing) {
            existing.theme = theme;
            existing.title = title;
            existing.paragraphs = paragraphs.length ? paragraphs : [rawContent];
            existing.imageData = editorPhotoBuffer;
            saveState();
            closePostEditor();
            showToast('Perubahan artikel berhasil disimpan!');
            if (currentView.name === 'article') renderArticle(existing.id);
            else render();
          }
        } else {
          const newPost = {
            id: theme + '-' + Date.now(),
            theme,
            title,
            date: formatNow(),
            likes: 1,
            dislikes: 0,
            imageData: editorPhotoBuffer,
            paragraphs: paragraphs.length ? paragraphs : [rawContent],
            comments: []
          };
          state.posts.unshift(newPost);
          saveState();
          closePostEditor();
          showToast('Artikel baru berhasil dipublikasikan!');
          navigate('article', newPost.id);
        }
      });

      // Quick Photo Upload directly from Article Titlebar or Admin Row
      document.getElementById('quickArticlePhotoInput').addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file || !quickPhotoTargetPostId) return;
        const post = state.posts.find(p => p.id === quickPhotoTargetPostId);
        if (!post) return;
        const reader = new FileReader();
        reader.onload = () => {
          post.imageData = reader.result;
          saveState();
          showToast('Foto artikel berhasil diperbarui!');
          render();
        };
        reader.readAsDataURL(file);
        e.target.value = '';
      });

      // ================= CONFIRM DELETE MODAL =================
      const deleteModal = document.getElementById('confirmDeleteModal');
      function askDeleteConfirm(message, onConfirm) {
        document.getElementById('confirmDeleteText').textContent = message;
        pendingDeleteAction = onConfirm;
        deleteModal.classList.remove('hidden');
      }

      function closeDeleteModal() {
        deleteModal.classList.add('hidden');
        pendingDeleteAction = null;
      }

      document.getElementById('closeDeleteModalBtn').addEventListener('click', closeDeleteModal);
      document.getElementById('cancelDeleteBtn').addEventListener('click', closeDeleteModal);
      deleteModal.addEventListener('click', (e) => {
        if (e.target === deleteModal) closeDeleteModal();
      });

      document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
        const action = pendingDeleteAction;
        closeDeleteModal();
        if (action) action();
      });

      // Boot App
      render();
    })();
  </script>
</body>
</html>
